name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install --only-binary ":all:" uv==0.5.4

      - name: Sync dependencies from lock file
        run: uv sync --locked --no-install-project --extra dev --no-build

      - name: Add venv to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint with ruff
        run: ruff check scripts/ tests/

      - name: Type check with mypy
        run: mypy scripts/ --ignore-missing-imports || true

      - name: Security scan with bandit
        run: bandit -r scripts/ -c pyproject.toml || true

      - name: Test with pytest
        run: pytest tests/ -v --tb=short

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        run: pytest tests/ --cov=scripts --cov-report=xml
        # In a real repo, add: uses: codecov/codecov-action@v4
