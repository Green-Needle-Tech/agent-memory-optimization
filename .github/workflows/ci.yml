name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install --only-binary ":all:" uv==0.5.4

      - name: Sync dependencies from lock file
        run: uv sync --frozen --extra dev

      - name: Lint with ruff
        run: uv run ruff check scripts/ tests/

      - name: Type check with mypy
        run: uv run mypy scripts/ --ignore-missing-imports || true

      - name: Security scan with bandit
        run: uv run bandit -r scripts/ -c pyproject.toml || true

      - name: Test with pytest
        run: uv run pytest tests/ -v --tb=short

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        run: uv run pytest tests/ --cov=scripts --cov-report=xml
        # In a real repo, add: uses: codecov/codecov-action@v4
